<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CV Builder</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <div class="page-shell">
      <section class="panel upload-panel">
        <h1>CV Builder</h1>
        <p class="subtitle">Import a DOCX table and save rows to the PostgreSQL database.</p>

        <form id="docxForm" class="upload-form">
          <label class="file-input-wrap">
            <span>Upload DOCX</span>
            <input type="file" id="docxFile" accept=".docx" />
          </label>
          <button type="submit">Read table</button>
        </form>

        <div id="message" class="message" aria-live="polite"></div>

        <div id="previewSection" class="preview hidden">
          <h2>Preview</h2>
          <table>
            <thead>
              <tr>
                <th>Title</th>
                <th>Opgave</th>
                <th>Rolle</th>
                <th>Resultat</th>
              </tr>
            </thead>
            <tbody id="previewBody"></tbody>
          </table>
          <button id="saveRows" type="button" class="secondary">Save to database</button>
        </div>
      </section>

      <section class="panel list-panel">
        <h2>Saved entries</h2>
        <div id="savedEntries" class="saved-entries"></div>
      </section>
    </div>

    <script>
      const previewSection = document.getElementById('previewSection');
      const previewBody = document.getElementById('previewBody');
      const messageBox = document.getElementById('message');
      const savedEntries = document.getElementById('savedEntries');
      let extractedRows = [];

      function setMessage(text, isError = false) {
        messageBox.textContent = text;
        messageBox.classList.toggle('error', isError);
      }

      async function loadEntries() {
        const response = await fetch('/api/items');
        const rows = await response.json();

        if (!Array.isArray(rows) || rows.length === 0) {
          savedEntries.innerHTML = '<p>No saved entries yet.</p>';
          return;
        }

        savedEntries.innerHTML = rows.map((row) => `
          <article class="entry-card">
            <h3>${row.title}</h3>
            <p><strong>Opgave:</strong> ${row.opgave}</p>
            <p><strong>Rolle:</strong> ${row.rolle}</p>
            <p><strong>Resultat:</strong> ${row.resultat}</p>
          </article>
        `).join('');
      }

      function renderPreview(rows) {
        previewBody.innerHTML = rows.map((row) => `
          <tr>
            <td>${row.title}</td>
            <td>${row.opgave}</td>
            <td>${row.rolle}</td>
            <td>${row.resultat}</td>
          </tr>
        `).join('');
        previewSection.classList.remove('hidden');
      }

      document.getElementById('docxForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const fileInput = document.getElementById('docxFile');
        const file = fileInput.files[0];

        if (!file) {
          setMessage('Please choose a DOCX file first.', true);
          return;
        }

        const formData = new FormData();
        formData.append('file', file);

        try {
          setMessage('Reading DOCX table...');
          const response = await fetch('/api/docx/import', {
            method: 'POST',
            body: formData,
          });

          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.message || 'Could not read the DOCX file.');
          }

          extractedRows = data.rows || [];
          renderPreview(extractedRows);
          setMessage(`Found ${extractedRows.length} rows to save.`);
        } catch (error) {
          setMessage(error.message, true);
          previewSection.classList.add('hidden');
        }
      });

      document.getElementById('saveRows').addEventListener('click', async () => {
        if (!extractedRows.length) {
          setMessage('No rows available to save yet.', true);
          return;
        }

        try {
          setMessage('Saving rows to the database...');
          const response = await fetch('/api/docx/save', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ rows: extractedRows }),
          });

          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.message || 'Could not save rows.');
          }

          setMessage(`Saved ${data.saved} rows.`);
          await loadEntries();
          previewSection.classList.add('hidden');
          document.getElementById('docxFile').value = '';
          extractedRows = [];
        } catch (error) {
          setMessage(error.message, true);
        }
      });

      loadEntries();
    </script>
  </body>
</html>
